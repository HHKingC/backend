<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Students</title>
</head>
<body>
    <h1>Welcome to the Haaga-Helia!</h1>
    <ul>
        <li th:each="student : ${students}"
            th:text="${student.firstName} + ' ' + ${student.lastName}">Student name</li>
    </ul>
</body>
</html>
