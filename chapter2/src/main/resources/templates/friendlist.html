<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Friend list</title>
</head>
<body>
    <h1>Friends</h1>
    <table>
        <tr>
            <th>First name</th>
            <th>Last name</th>
        </tr>
        <tr th:each="friend : ${friends}">
            <td th:text="${friend.firstName}">First</td>
            <td th:text="${friend.lastName}">Last</td>
        </tr>
    </table>
    <p><a th:href="@{/add}">Add friend</a></p>
</body>
</html>
